name: Validate Maintenance
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/data-update.yml'
      - '.github/workflows/validate-maintenance.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/data-update.yml'
      - '.github/workflows/validate-maintenance.yml'
      - 'requirements.txt'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
