name: Update Market Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-update.yml'
      - 'scripts/update_data.py'
      - 'scripts/validate_market_data.py'
      - 'scripts/market_data_quality.py'
      - 'tests/test_benchmark_fallback.py'
      - 'scripts/update_market_regime.py'
      - 'scripts/compute_cycle.py'
      - 'config/market-regime.json'
      - 'scripts/backfill_missing.py'
      - 'scripts/apply_labels.py'
      - 'requirements.txt'
      - 'config/sectors.json'
      - 'ops/market-data-watchdog.json'
  schedule:
    # 14:10 Asia/Taipei, Monday-Friday
    - cron: '10 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline benchmark regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Backfill newly configured stocks
        run: python scripts/backfill_missing.py

      - name: Bootstrap or update market data
        run: python scripts/update_data.py

      - name: Apply display labels and groups
        run: python scripts/apply_labels.py

      - name: Compute deterministic market regime
        run: python scripts/update_market_regime.py

      - name: Compute theme turn-strong radar
        run: python scripts/compute_cycle.py

      - name: Validate generated data
        run: python scripts/validate_market_data.py

      - name: Commit generated data with bounded fresh-base retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add data/market_history.json data/latest/rotation.json data/latest/rotation.js data/latest/cycle.json state/market-regime.json history/market-regime
            if git diff --cached --quiet; then
              echo 'No market data changes.'
              exit 0
            fi
            git commit -m "data: update AI sector radar market data"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Publication failed after three attempts; remote changes were not overwritten.'
              exit 1
            fi
            echo "Push failed; refetching and regenerating on latest main (attempt $((attempt + 1)))."
            git fetch origin main
            # This is the disposable Actions checkout. Discard only the local
            # unpublished generated commit; never force-push remote history.
            git reset --hard origin/main
            pip install -r requirements.txt
            python -m unittest discover -s tests -p 'test_*.py' -v
            python scripts/backfill_missing.py
            python scripts/update_data.py
            python scripts/apply_labels.py
            python scripts/update_market_regime.py
            python scripts/compute_cycle.py
            python scripts/validate_market_data.py
          done
