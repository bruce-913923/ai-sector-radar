name: Update Market Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-update.yml'
      - 'scripts/update_data.py'
      - 'requirements.txt'
      - 'config/sectors.json'
  schedule:
    # 17:10 Asia/Taipei, Monday-Friday
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap or update market data
        run: python scripts/update_data.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/latest/rotation.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data.get('sectors', [])) >= 3
          for s in data['sectors']:
              assert len(s.get('path', [])) >= 5, s.get('id')
          assert Path('data/latest/rotation.js').exists()
          assert Path('data/market_history.json').exists()
          print('validated', data['updated_at'], len(data['sectors']), 'sectors')
          PY

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_history.json data/latest/rotation.json data/latest/rotation.js
          if git diff --cached --quiet; then
            echo 'No market data changes.'
            exit 0
          fi
          git commit -m "data: update AI sector radar market data"
          git push
